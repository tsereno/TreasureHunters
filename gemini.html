<!DOCTYPE html>
<html>
<head>
    <title>Gemini API Key and Model Selection</title>
    <style>
        body { font-family: sans-serif; }
        label { display: block; margin-top: 10px; }
        input[type="password"], select { margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Gemini API Configuration</h1>

    <div>
        <label for="apiKey">Gemini API Key:</label>
        <input type="password" id="apiKey" name="apiKey">
    </div>

    <div>
        <label for="modelSelect">Select Gemini Model:</label>
        <select id="modelSelect" name="modelSelect">
            <!-- Options will be populated by JavaScript -->
        </select>
    </div>

    <script>
        // Function to fetch available models from the Gemini API
        async function fetchGeminiModels() {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                console.error("API Key is required to fetch models.");
                return [];
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data.models || [];
            } catch (error) {
                console.error("Error fetching Gemini models:", error);
                return [];
            }
        }

        // Function to populate the model dropdown
        async function populateModelDropdown() {
            const modelSelect = document.getElementById('modelSelect');
            modelSelect.innerHTML = ''; // Clear existing options

            const availableModels = await fetchGeminiModels();

            if (availableModels.length === 0) {
                const option = document.createElement('option');
                option.value = "";
                option.textContent = "Could not fetch models. Enter API Key.";
                modelSelect.appendChild(option);
                return;
            }

            availableModels.forEach(model => {
                const option = document.createElement('option');
                option.value = model.name;
                option.textContent = model.displayName || model.name;
                modelSelect.appendChild(option);
            });
        }

        // Call the function to populate the dropdown when the page loads or API key is entered
        window.onload = populateModelDropdown;
        document.getElementById('apiKey').addEventListener('change', populateModelDropdown);

        // You would add logic here to handle the API key input and model selection
        // For example, storing the API key securely and using the selected model
    </script>
</body>
</html>
