<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Nano with Transformers.js (CDN Example)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    #output { margin-top: 1em; padding: 1em; background: #f5f5f5; border-radius: 6px; }
    label, button { font-size: 1.1em; }
    input[type="text"] { width: 60%; padding: 0.5em; font-size: 1em; }
  </style>
</head>
<body>
  <h1>Gemini Nano Text Generation Demo</h1>
  <label for="prompt">Enter your prompt:</label>
  <input type="text" id="prompt" value="Tell me a fun fact about space." />
  <button id="generate">Generate</button>
  <div id="output"></div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0'; // Corrected URL

    let generator;
    const outputDiv = document.getElementById('output');
    const button = document.getElementById('generate');
    const promptInput = document.getElementById('prompt');

    async function setup() {
      outputDiv.textContent = "Loading model (this may take a while the first time)...";
      // Change the model ID if you have a different Gemini Nano variant
      // Replace 'Xenova/gemini-nano' with a known model like distilgpt2
      generator = await pipeline('text-generation', 'Xenova/distilgpt2',{ dtype: "q8" }) // Explicitly set dtype);
      outputDiv.textContent = "Model loaded! Enter a prompt and click Generate.";
    }

    async function generateText() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;
      outputDiv.textContent = "Generating...";
      try {
        const result = await generator(prompt, { max_new_tokens: 128 });
        outputDiv.textContent = result[0].generated_text;
      } catch (err) {
        outputDiv.textContent = "Error: " + err.message;
      }
    }

    button.addEventListener('click', generateText);

    setup();
  </script>
</body>
</html>
