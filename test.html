<!DOCTYPE html>
<html>
<head>
  <title>WebLLM Demo</title>
</head>
<body>
  <script type="module">
    import { ChatModule } from "https://mpsych.github.io/cdn/web-llm/web-llm-cdn.js";

    async function run() {
      const model = new ChatModule();
      await model.reload("Phi-3-mini-4k-instruct-q4f16_1");
      const response = await model.generate("Hello");
      document.body.innerHTML = response;
    }

    run();
  </script>
</body>
</html>
