<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM.js via CDN Example</title>
  <!-- Include the CDN version of web-llm -->
  <script src="https://mpsych.github.io/cdn/web-llm/web-llm-cdn.js"></script>
</head>
<body>
  <h1>LLM.js CDN Example</h1>
  <pre id="result"></pre>
  <script>
    // Wait until the script is loaded
    window.addEventListener('DOMContentLoaded', async () => {
      // Check if WebLLM is available
      if (window.WebLLM) {
        // Initialize the model (adjust model URL as needed)
        const model = new window.WebLLM({
          modelUrl: "https://huggingface.co/RichardErkhov/bigcode_-_tiny_starcoder_py-gguf/resolve/main/tiny_starcoder_py.Q8_0.gguf"
        });

        await model.load();
        const result = await model.generate("def fibonacci(n):");
        document.getElementById('result').textContent = result;
      } else {
        document.getElementById('result').textContent = "WebLLM not loaded!";
      }
    });
  </script>
</body>
</html>
