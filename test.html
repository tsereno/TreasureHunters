<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM.js WebAssembly Example</title>
</head>
<body>
  <h1>LLM.js WebAssembly Example</h1>
  <pre id="result"></pre>
  <script type="module">
    import { LLM } from './llm.js/llm.js'; // Adjust the path as needed

    let model_loaded = false;
    const initial_prompt = "def fibonacci(n):";

    // Callback functions
    const on_loaded = () => { model_loaded = true; };
    const write_result = (text) => {
      document.getElementById('result').innerText += text + "\n";
    };
    const run_complete = () => {};

    // Configure LLM app
    const app = new LLM(
      'GGUF_CPU', // Model type
      'https://huggingface.co/RichardErkhov/bigcode_-_tiny_starcoder_py-gguf/resolve/main/tiny_starcoder_py.Q8_0.gguf', // Model URL
      on_loaded,
      write_result,
      run_complete
    );

    // Download & load model in a Web Worker
    app.load_worker();

    // Run the model after loading
    const checkInterval = setInterval(() => {
      if (model_loaded) {
        app.run({ prompt: initial_prompt, top_k: 1 });
        clearInterval(checkInterval);
      } else {
        console.log('Waiting for model to load...');
      }
    }, 1000);
  </script>
</body>
</html>
